name: silent_talk_app
description: A Flutter application displaying an image with a creamy background.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  camera: ^0.10.5+5
  web_socket_channel: ^3.0.3
  http: ^1.3.0
  path_provider: ^2.1.5
  image: ^4.5.4
  path: ^1.8.2
  flutter_webrtc: 0.9.41
  webrtc_interface: 1.1.1
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/signs/